[project]
name = "genebe-mcp"
version = "0.1.0"
description = "Read-only remote MCP server for GeneBe variant annotation and ACMG classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genebe_mcp"]

[project.scripts]
genebe-mcp = "genebe_mcp.__main__:main"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real GeneBe API (run with -m live)"]
